# Compact dual-mode dashboard theme (based on Streamlit's dense-dashboard template).
# The settings appearance toggle stays available.

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "12px"
headingFontSizes = ["24px", "18px", "16px", "14px", "13px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
metricValueFontSize = "1.5rem"
metricValueFontWeight = 600
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "3rem"

[theme.light]
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#1D4ED8"
borderColor = "#E2E8F0"
codeTextColor = "#334155"
greenColor = "#1D4ED8"
redColor = "#DC2626"
yellowColor = "#D97706"
orangeColor = "#0D9488"
blueColor = "#0EA5E9"
violetColor = "#7C3AED"
grayColor = "#64748B"
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeHeaderTextColor = "#0F172A"

[theme.dark]
primaryColor = "#2563EB"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
linkColor = "#60A5FA"
borderColor = "#334155"
codeTextColor = "#CBD5E1"
greenColor = "#2563EB"
redColor = "#F87171"
yellowColor = "#FBBF24"
orangeColor = "#2DD4BF"
blueColor = "#38BDF8"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"
dataframeHeaderTextColor = "#F8FAFC"

[theme.sidebar]
paddingTop = "0.5rem"
paddingBottom = "1.5rem"

[theme.light.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
codeBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#1D4ED8"
linkColor = "#1D4ED8"

[theme.dark.sidebar]
backgroundColor = "#020617"
secondaryBackgroundColor = "#1E293B"
codeBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"
primaryColor = "#2563EB"
linkColor = "#60A5FA"
